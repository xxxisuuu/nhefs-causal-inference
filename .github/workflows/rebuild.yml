name: rebuild results
# re-runs the full analysis (500 bootstraps, ~5 min) and commits results + figures if they changed.
# run it by hand from the Actions tab after changing the models.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # kaleido 1.x needs Chrome; the ubuntu runner ships google-chrome
      - run: python src/analysis.py
        env:
          BROWSER_PATH: /usr/bin/google-chrome
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.csv results_bootstrap.csv figures/
          git diff --cached --quiet || git commit -m "Rebuild results and figures"
          git push
